name: Validate Studio & Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'apps/web/**'
      - 'apps/slides/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Slides' browser review runs locally; CI only needs its unit tests.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + UI guardrails + conventions)
        run: pnpm lint

      - name: Unit tests (loaders, migration, view helpers, slides)
        run: pnpm test

      - name: Build Sanity Studio (validates schema)
        run: pnpm --filter studio build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: production

      - name: Typecheck slides
        run: pnpm --filter slides typecheck

      - name: Typecheck web app
        run: pnpm --filter web typecheck
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: production
