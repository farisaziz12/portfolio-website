name: Agent PR visual evidence

# Fails agent-authored PRs that touch UI without before/after screenshots.
# N/A is allowed only when the diff has no visual-surface files.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  visual-evidence:
    name: Before/after screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-test checker
        run: node .github/scripts/check-agent-pr-visual-evidence.mjs --self-test

      - name: Check PR body and changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node .github/scripts/check-agent-pr-visual-evidence.mjs
