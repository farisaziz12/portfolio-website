# Rebuilds the production site on a schedule so time-based content stays right:
# events move from "upcoming" to "past", "Next up" strips and the availability
# calendar roll forward. Pages are static (see docs/sanity-guide.md → "When
# the site updates"); the browser also hides items that ended between builds.
#
# Every 6 hours, so an event anywhere in the world (status is computed in its
# own timezone) is past within ~6 h of its last day ending. 23:05 UTC is just
# after midnight in Zurich in both summer and winter time.
#
# Required repo secret:
#   VERCEL_DEPLOY_HOOK_URL — Vercel → Project → Settings → Git → Deploy Hooks →
#                            create one for branch "main", copy the URL.
# The same hook URL is what the Sanity "publish" webhook calls.
name: Scheduled rebuild

on:
  schedule:
    - cron: '5 5,11,17,23 * * *'
  workflow_dispatch: {}

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set (repo Settings → Secrets → Actions). See the header of this workflow."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null -w "Deploy hook answered %{http_code}\n"
